name: Sincronización Diaria de Empleos Perú

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC (6:00 AM hora de Perú)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      - name: Ejecutar Extractor y Normalizador de Empleos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python backend/sync_jobs.py

      - name: Guardar y Publicar cambios automáticos
        run: |
          git config --local user.email "bot@chambaperu.dev"
          git config --local user.name "ChambaPeru Automation Bot"
          git add web/public/data/jobs.json web/public/sitemap.xml web/public/robots.txt
          git diff --staged --quiet || (git commit -m "chore(sync): actualización automática diaria de ofertas" && git push)
