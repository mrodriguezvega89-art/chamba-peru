name: Sincronización Automática cada 6 horas - Empleos Perú

on:
  schedule:
    # Se ejecuta cada 6 horas: 6:00 AM, 12:00 PM, 6:00 PM, 12:00 AM (Medianoche) hora de Perú (UTC-5 -> 11:00, 17:00, 23:00, 05:00 UTC)
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      - name: Ejecutar Extractor y Normalizador de Empleos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python backend/sync_jobs.py

      - name: Guardar y Publicar cambios automáticos
        run: |
          git config --local user.email "bot@chambaperu.dev"
          git config --local user.name "ChambaPeru Automation Bot"
          git add web/public/data/jobs.json web/public/sitemap.xml web/public/robots.txt
          git diff --staged --quiet || (git commit -m "chore(sync): sincronización automática cada 6h (6am, 12pm, 6pm, 12am Perú)" && git push)
